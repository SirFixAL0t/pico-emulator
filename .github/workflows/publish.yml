name: Publish picoemu (npm + GitHub Packages)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to publish from"
        required: true
        default: "main"
      version:
        description: "Version (semver, e.g. 1.0.4)"
        required: true
        default: "1.0.4"
      description:
        description: "Package description"
        required: true
        default: "Pico-emu RP2040/RP2350 (M0+/M33/RV32) browser emulator (WASM)"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Validate version (semver)
        run: |
          if ! echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid semver: ${{ inputs.version }}"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Generate web/package.json from inputs
        env:
          PKG_VERSION: ${{ inputs.version }}
          PKG_DESC: ${{ inputs.description }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = {
              name: "pico-emu",
              version: process.env.PKG_VERSION,
              description: process.env.PKG_DESC,
              type: "module",
              main: "picoemu.wasm.js",
              bin: { "pico-emu": "cli.js", picoemu: "cli.js" },
              license: "MIT",
              repository: { type: "git", url: "https://github.com/danish9661/pico-emulator.git" },
              files: ["picoemu.wasm.js", "picoemu.wasm.threads.js", "picoemu.wasm.wasm", "picoemu.wasm.threads.wasm", "picoemu_worker.js", "cli.js", "index.html", "about.html", "docs.html", "site.css", "favicon.ico", "picoemu-logo.png", "README.md", "firmware/*.uf2"],
            };
            fs.writeFileSync("web/package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log(fs.readFileSync("web/package.json", "utf8"));
          '
          test -f web/picoemu.wasm.js -a -f web/picoemu.wasm.wasm -a -f web/index.html

      - name: Vendor MIT license into package (upstream + port attribution)
        run: |
          cp LICENSE web/LICENSE
          grep -q "danish9661" web/LICENSE

      - name: Smoke test (native build + WASM boot)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure
          node test-wasm.js

      - name: Pack (dry-run contents check)
        working-directory: web
        run: npm pack --dry-run

      - name: Publish to npmjs (pico-emu)
        working-directory: web
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is missing or empty. Add it under repo Settings -> Secrets and variables -> Actions -> New repository secret (npmjs automation token)."
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > ~/.npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Rename to repo scope for GitHub Packages
        working-directory: web
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.name = "@danish9661/pico-emu";
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@danish9661"

      - name: Publish to GitHub Packages (@danish9661/pico-emu)
        working-directory: web
        run: |
          printf '@danish9661:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > ~/.npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
